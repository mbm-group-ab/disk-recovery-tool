name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:disk-recovery-tool --project mbm-group-ab --non-interactive

  # A push only runs the checks. The hub sees this run finish and asks the owner in
  # MBM Control (@MBM_HUB_BOT); "Deploy" there sends repository_dispatch (type deploy).
  await-approval:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "The deploy waits for the owner's OK in MBM Control."
