name: Tag and Build GUI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: bump
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: DiskRecoveryGUI-windows.exe
            build_path: dist/DiskRecoveryGUI.exe
          - os: macos-latest
            artifact_name: DiskRecoveryGUI-macos
            build_path: dist/DiskRecoveryGUI
          - os: ubuntu-latest
            artifact_name: DiskRecoveryGUI-linux
            build_path: dist/DiskRecoveryGUI
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name DiskRecoveryGUI recovery_gui.py

      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.build_path }}" "${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          files: ${{ matrix.artifact_name }}
